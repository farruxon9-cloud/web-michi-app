name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.michi.jp.net
          VITE_APP_ENV: production

      - name: No console.log in bundle
        run: "! grep -l 'console.log' dist/assets/*.js"

      - name: No secrets in bundle
        run: "! grep -lE 'AIza[0-9A-Za-z_-]{30}|gsk_[A-Za-z0-9]{20}|sk-[A-Za-z0-9]{20}|hf_[A-Za-z0-9]{20}' dist/assets/*.js"

      - name: Security headers file shipped
        run: test -f dist/_headers

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
