name: Michi App CI/CD Pipeline (web.michi.jp.net)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-lint:
    name: 🔍 Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 6.3.2 Lint Check (npm run lint)
        run: npm run lint || echo "Linting completed with warnings"

      - name: 6.3.3 Unit Test Verification (npm run test)
        run: npm run test

      - name: 6.3.4 Build Production Bundle (npm run build)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/

  deploy-preview:
    name: ⚡ 6.3.5 Preview Deploy (Pull Requests)
    needs: validate-and-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: michi-web-app
          directory: dist

  deploy-production:
    name: 🚀 6.3.6 Production Deploy (main -> web.michi.jp.net)
    needs: validate-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-build
          path: dist/

      - name: Deploy Production to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: michi-web-app
          directory: dist
          branch: main
